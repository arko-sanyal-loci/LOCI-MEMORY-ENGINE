# Billo.tech VPS — External reverse proxy to workstation sovereign engine
# OR local mirror when workstation is unreachable
#
# Deploy on VPS (srv1775801.hstgr.cloud):
#   sudo cp this_file /etc/nginx/sites-available/billo_tech
#   sudo ln -sf /etc/nginx/sites-available/billo_tech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires: SSH tunnel from VPS to workstation
#   ssh -N -L 8000:127.0.0.1:8000 arko-sanyal@192.168.10.181
# Or: WireGuard/Tailscale VPN tunnel for persistent connectivity

upstream workstation_engine {
    # Via SSH tunnel or VPN — workstation's sovereign engine
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;

    server_name billo.tech www.billo.tech srv1775801.hstgr.cloud;

    # Rate limit — public-facing
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # === Public landing / dashboard ===
    location / {
        proxy_pass http://workstation_engine;
    }

    # === LOCI Bridge — rate-limited for external access ===
    location /loci/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://workstation_engine;
    }

    # === Sovereign Telemetry (read-only for external) ===
    location /heat/api/v1/telemetry {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://workstation_engine;
        # Only allow GET
        limit_except GET {
            deny all;
        }
    }

    # === Block write endpoints from external ===
    location /heat/api/v1/verify-action {
        deny all;
        return 403 '{"error":"Write operations restricted to subnet"}';
        add_header Content-Type application/json;
    }

    # === Feedback platform — external submissions allowed ===
    location /loci/feedback/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://workstation_engine;
    }

    # === Health ===
    location /health {
        return 200 '{"status":"ok","node":"vps","host":"billo.tech"}';
        add_header Content-Type application/json;
    }
}
