# LOCI Unified Architecture — Nginx Reverse Proxy
# Single entry point for all services on the subnet
#
# Install: sudo apt-get install -y nginx
# Deploy:  sudo cp this_file /etc/nginx/sites-available/loci_unified
#          sudo ln -sf /etc/nginx/sites-available/loci_unified /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx

upstream sovereign_engine {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Workstation — subnet access (192.168.10.0/24)
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name workstation.local 192.168.10.181;

    # Security: only allow subnet + localhost
    allow 192.168.10.0/24;
    allow 127.0.0.0/8;
    deny all;

    # Timeouts for inference (Ollama can take 30-120s)
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # === Sovereign Dashboard ===
    location / {
        proxy_pass http://sovereign_engine;
    }

    # === Sovereign Telemetry & Guardrails ===
    location /heat/ {
        proxy_pass http://sovereign_engine;
    }

    # === LOCI Bridge (all 30 REST routes) ===
    location /loci/ {
        proxy_pass http://sovereign_engine;
    }

    # === FastAPI auto-generated docs ===
    location /docs {
        proxy_pass http://sovereign_engine;
    }
    location /openapi.json {
        proxy_pass http://sovereign_engine;
    }

    # === Health check ===
    location /health {
        return 200 '{"status":"ok","node":"workstation","ip":"192.168.10.181"}';
        add_header Content-Type application/json;
    }

    # Block direct access to Ollama — force through /loci/ollama/
    location /api/ {
        return 403 '{"error":"Direct Ollama access blocked. Use /loci/ollama/generate"}';
        add_header Content-Type application/json;
    }
}
