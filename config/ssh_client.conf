# ~/.ssh/config — LOCI Cluster SSH Client Configuration
# Copy this to ~/.ssh/config on your Ubuntu desktop (192.168.0.149 / console node).
# Or append it: cat config/ssh_client.conf >> ~/.ssh/config
#
# Key assumed at: ~/.ssh/billo_vps  (or adjust IdentityFile paths below)
# Arc keys provisioned to: /root/.arc_keys/ on VPS

# -----------------------------------------------------------------------
# GLOBAL DEFAULTS
# -----------------------------------------------------------------------
Host *
    ServerAliveInterval     60
    ServerAliveCountMax      3
    ConnectTimeout          10
    AddKeysToAgent          yes
    IdentitiesOnly          yes
    # Harden client side — prevent host-key downgrade / MITM
    HostKeyAlgorithms       ssh-ed25519-cert-v01@openssh.com,ssh-ed25519,ecdsa-sha2-nistp256
    KexAlgorithms           curve25519-sha256,curve25519-sha256@libssh.org
    Ciphers                 chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
    MACs                    hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# -----------------------------------------------------------------------
# VPS — Primary LOCI node (Hostinger)
# -----------------------------------------------------------------------
Host billo_vps vps loci-vps
    HostName     srv1775801.hstgr.cloud
    User         root
    IdentityFile ~/.ssh/billo_vps
    # Forward only the LOCI MCP port, nothing else
    LocalForward  8765 127.0.0.1:8765

# -----------------------------------------------------------------------
# Workstation — local LAN (Windows / primary desktop)
# -----------------------------------------------------------------------
Host workstation ws
    HostName     192.168.0.181
    User         arko-sanyal
    IdentityFile ~/.ssh/billo_vps

# -----------------------------------------------------------------------
# Console — Ubuntu LAN node
# -----------------------------------------------------------------------
Host console
    HostName     192.168.0.149
    User         arko-sanyal
    IdentityFile ~/.ssh/billo_vps

# -----------------------------------------------------------------------
# Mac Mini — Staged / DFU recovery node
# -----------------------------------------------------------------------
Host mac-mini macmini
    HostName     192.168.0.150
    User         arko-sanyal
    IdentityFile ~/.ssh/billo_vps
    # Expect key not yet trusted until onboarding completes
    StrictHostKeyChecking ask

# -----------------------------------------------------------------------
# GitHub — deploy key for loci-memory-engine
# -----------------------------------------------------------------------
Host github.com
    HostName     github.com
    User         git
    IdentityFile ~/.ssh/billo_vps
