name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # No silent fallbacks: if the package stops installing, CI should say so.
        run: pip install -e ".[dev,mcp,rag,bridge]"
      - name: Run tests
        # pytest, not unittest discover: the coordination bus tests are
        # pytest-style and unittest skipped all 42 of them.
        run: python -m pytest -q
