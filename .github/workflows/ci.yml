name: Loci Invariant Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Verify Python Environment
        run: |
          python3 --version

      - name: Run Operational Taxonomy Suite (run_suite)
        env:
          LOCI_USER: arko-sanyal
        run: |
          python3 -c "import loci_engine.unified_core as uc; uc.run_suite()"

      - name: Run Invariant Unit Tests
        env:
          LOCI_USER: arko-sanyal
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v
