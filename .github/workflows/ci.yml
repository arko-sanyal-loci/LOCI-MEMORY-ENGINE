name: Loci Invariant Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Operational Taxonomy Suite (run_suite)
        env:
          LOCI_USER: arko-sanyal
        run: |
          python3 -c "import loci_engine.unified_core as uc; uc.run_suite()"

      - name: Run Invariant Unit Tests
        env:
          LOCI_USER: arko-sanyal
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
