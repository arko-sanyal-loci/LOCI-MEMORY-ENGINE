name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # No "|| true": a broken pyproject must fail the build, not be skipped.
        run: pip install -e ".[dev,mcp,rag]"
      - name: Byte-compile every module
        run: python -m compileall -q loci_engine coordination_bus rag scripts
      - name: Run tests
        # pytest, not unittest: unittest discovery silently skipped the
        # 42 pytest-style coordination_bus tests.
        run: python -m pytest -q
