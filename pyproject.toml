[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loci-memory-engine"
version = "0.1.0"
description = "LOCI: heat-tiered, goal-conditioned persistent memory for AI agents, with the Glassbox ledger and a secure coordination bus"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arko Sanyal", email = "arko.sanyal@gmail.com" }]
# The core engine (loci_engine/) and the coordination bus are standard library only.
dependencies = []

[project.optional-dependencies]
# MCP server for the coordination bus. The code uses mcp.server.fastmcp, which
# was renamed in mcp 2.x, so stay on the 1.x line.
mcp = ["mcp>=1.2,<2"]
# HTTP bridge (loci_engine/sovereign_bridge.py)
bridge = ["fastapi>=0.110", "pydantic>=2", "httpx>=0.27"]
# Document RAG pipeline (rag/), needs a local Ollama
rag = ["ollama>=0.4", "httpx>=0.27", "sqlite-vec>=0.1.9", "pypdf>=5", "langchain-core>=1.0", "langchain-text-splitters>=1.0"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/arko-sanyal-loci/LOCI-MEMORY-ENGINE"
Papers = "https://github.com/arko-sanyal-loci/loci-card-papers"
Runtime = "https://github.com/arko-sanyal-loci/arc"

[tool.setuptools.packages.find]
include = ["loci_engine*", "coordination_bus*", "rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
