# ==============================================================================
# Nginx Configuration for Billo & LOCI Services
# Domains: billo.tech, arc.billo.tech
# ==============================================================================

upstream billo_api {
    server unix:/run/billo/billo.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name billo.tech www.billo.tech arc.billo.tech;

    client_max_body_size 64M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse proxy API endpoints to Uvicorn Unix socket
    location / {
        proxy_pass http://billo_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Static assets caching if frontend UI bundle exists
    location /static/ {
        alias /opt/billo/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
